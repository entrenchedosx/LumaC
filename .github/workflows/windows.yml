name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Vulkan SDK
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK) {
            winget install -e --id KhronosGroup.VulkanSDK --silent `
              --accept-package-agreements --accept-source-agreements
          }
          Get-ChildItem env:VULKAN_SDK

      - name: Configure (static)
        shell: pwsh
        run: cmake -S . -B build

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug

      - name: Test Debug
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test Release
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Configure (shared)
        shell: pwsh
        run: cmake -S . -B build_shared -DLUMAC_BUILD_SHARED=ON

      - name: Build shared Debug
        shell: pwsh
        run: cmake --build build_shared --config Debug

      - name: Test shared Debug
        shell: pwsh
        run: ctest --test-dir build_shared -C Debug --output-on-failure
